; HWCDC RX dies when the host writes before Serial.begin() (arduino-esp32 3.3.13).
;
;   pio run -e stock -t upload    then  python host.py <port>    -> every try fails
;   pio run -e fixed -t upload    then  python host.py <port>    -> every try passes
;
; Both use pioarduino 55.03.313 (Arduino 3.3.13, ESP-IDF 5.5.6). "fixed" swaps in an
; arduino-esp32 3.3.13 with the one-line fix to HWCDC::begin(); nothing else differs.

[platformio]
src_dir = repro
; Optional local overrides (not committed), e.g. to point "fixed" at a local checkout.
extra_configs = local.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino
; Any ESP32-S3 board works; for an ESP32-C3/C6/H2 use its board ID (they have the same USB Serial/JTAG port).
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:stock]

[env:fixed]
platform_packages =
    framework-arduinoespressif32 @ https://github.com/m-mcgowan/arduino-esp32.git#fix/hwcdc-keep-pending-rx-3.3.13
