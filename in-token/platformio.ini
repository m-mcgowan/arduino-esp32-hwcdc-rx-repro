; The IN-token interrupt's CPU cost (arduino-esp32 3.3.13): loop() iterations per second at
; 80 MHz while a host has the port open.
;
;   pio run -d in-token -e <env> -t upload    then read the port for ~15 s
;
; stock   3.3.13: TOKEN_REC_IN_EP1 interrupts on every IN token the host sends
; sampled 3.3.13 with the interrupt off and the token's raw status sampled instead
; v3311   3.3.11: before the interrupt was added

[platformio]
; Optional local overrides (not committed), e.g. to point "sampled" at a local checkout.
extra_configs = local.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino
; Any ESP32-S3 board works; for an ESP32-C3/C6/H2 use its board ID.
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:stock]

[env:sampled]
platform_packages =
    framework-arduinoespressif32 @ https://github.com/m-mcgowan/arduino-esp32.git#3.3.13-hwcdc2

[env:v3311]
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
